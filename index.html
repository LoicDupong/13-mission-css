<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission CSS | Flip card</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4a8e7b5374.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="wrapper">
        <div class="card">
            <div class="content">
                <div class="front">
                    <div class="card-content">
                        <img src="img/profil.png" alt="" class="card-img">
                        <div class="card-text">
                            <h2 class="card-title">Loic Dupong</h2>
                            <p class="card-subtitle">Web Developer</p>
                        </div>
                    </div>
                </div>
                <div class="back">
                   <div class="card-description">
                    <p class="card-title">Description</p>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque saepe, neque repudiandae quae placeat quisquam unde. Officia aut eius soluta commodi totam praesentium omnis sint. Dolore provident vel eligendi id!</p>
                   </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
